name: Live-API

# Ruft die echte smartENERGY-API ab und prüft, ob sie noch das liefert, worauf
# die Integration baut. Bewusst getrennt von validate.yml: Die PR-CI bleibt so
# offline und unabhängig von einem fremden Server, während ein Formatwechsel der
# API trotzdem innerhalb eines Tages auffällt.
on:
  schedule:
    # Täglich 04:17 UTC (06:17 Wien). Krumme Minute, um die Lastspitze zur
    # vollen Stunde bei GitHub zu meiden.
    - cron: "17 4 * * *"
  workflow_dispatch:

# Immer nur ein Lauf gleichzeitig: Sonst könnten sich ein geplanter und ein
# manuell gestarteter Lauf überholen, beide vergeblich nach einem offenen
# Fehler-Issue suchen und je eines anlegen. Nicht abbrechen, damit ein bereits
# laufender Test zu Ende kommt.
concurrency:
  group: live-api
  cancel-in-progress: false

# Standardmäßig keine Rechte; jeder Job fordert einzeln an, was er braucht.
permissions: {}

env:
  # Kennzeichnet das Issue, das dieser Workflow bei Fehlschlägen führt.
  FEHLER_LABEL: live-api-fehler

jobs:
  live:
    name: Live-API-Vertragstest
    runs-on: ubuntu-latest
    permissions:
      # Nur Lesezugriff aufs Repo. Das Melden erledigt der Job "bericht", damit
      # Checkout, Setup und Testlauf ohne Schreibrechte auskommen.
      contents: read
    outputs:
      # URL des Artefakts mit den Rohantworten, damit der Bericht direkt darauf
      # zeigen kann. Wird auch von einem fehlgeschlagenen Job übergeben – genau
      # dann läuft der Upload-Schritt ja (siehe "if: failure()" unten). Bleibt
      # leer, wenn er übersprungen wurde.
      antworten_url: ${{ steps.antworten.outputs.artifact-url }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Run live tests
        env:
          # Weist die Live-Tests an, die abgerufenen Antworten hier abzulegen
          # (siehe lege_antwort_ab in tests/test_api_live.py). Schrittbezogen,
          # damit der Geltungsbereich sichtbar bleibt.
          LIVE_ANTWORT_DIR: ${{ runner.temp }}/live-antworten
        run: pytest -m live --live

      # Ohne diesen Schritt stirbt die Antwort mit dem Runner – und damit das
      # Belegmaterial für die wahrscheinlichste Ursache eines Fehlschlags. Nur im
      # Fehlerfall: Bei einem grünen Lauf belegt die Fixture im Repo bereits, wie
      # die API antwortet. Das "if" hebt zugleich die Vorgabe auf, dass Schritte
      # nach einem Fehlschlag übersprungen werden.
      #
      # Braucht keine zusätzlichen "permissions": upload-artifact nutzt den
      # Runtime-Token des Laufs, nicht GITHUB_TOKEN.
      - name: Rohantworten der API sichern
        if: failure()
        id: antworten
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-antworten
          # Muss mit LIVE_ANTWORT_DIR im Schritt darüber übereinstimmen.
          path: ${{ runner.temp }}/live-antworten
          # Kein zweiter roter Schritt, wenn nichts abgelegt wurde – etwa weil
          # die API gar nicht erreichbar war und es keine Antwort gab. Der
          # eigentliche Fehlschlag steht schon im Testlauf.
          if-no-files-found: warn

  # Bewusst kein Verlass auf die E-Mail-Benachrichtigung von GitHub: Die geht
  # bei geplanten Läufen nur an die Person, die den cron-Ausdruck zuletzt
  # geändert hat, und hängt an deren Notification-Einstellungen. Ein Issue ist
  # dagegen im Repo sichtbar und bleibt liegen, bis es jemand schließt.
  bericht:
    name: Fehlschlag melden
    needs: live
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      # Legt das Fehler-Issue an bzw. kommentiert es – mehr braucht dieser Job
      # nicht, insbesondere keinen Checkout.
      issues: write
    steps:
      - name: Fehler-Issue anlegen oder kommentieren
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LAUF_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Leer, wenn der Testlauf keine Antwort erhalten und daher nichts
          # abgelegt hat.
          ANTWORTEN_URL: ${{ needs.live.outputs.antworten_url }}
        run: |
          set -euo pipefail

          # Label selbst anlegen, damit der Workflow ohne Vorbereitung im Repo
          # funktioniert (--force ist idempotent, meckert also beim zweiten Mal nicht).
          gh label create "$FEHLER_LABEL" \
            --description "Der nächtliche Vertragstest gegen die smartENERGY-API ist fehlgeschlagen" \
            --color B60205 \
            --force

          # Liegt schon ein offenes Issue vor, nur kommentieren – sonst entsteht
          # bei einer längeren Störung jede Nacht ein neues.
          nummer="$(gh issue list \
            --label "$FEHLER_LABEL" --state open --limit 1 \
            --json number --jq '.[0].number // empty')"

          if [ -n "$nummer" ]; then
            # Über eine Datei statt --body, weil der Hinweis auf das Artefakt nur
            # bedingt dazukommt – jeder Fehlschlag hat sein eigenes.
            {
              printf 'Erneut fehlgeschlagen am %s: %s\n' \
                "$(date -u '+%d.%m.%Y %H:%M UTC')" "$LAUF_URL"
              if [ -n "$ANTWORTEN_URL" ]; then
                printf '\n**Rohantworten der API:** %s\n' "$ANTWORTEN_URL"
              fi
            } > "$RUNNER_TEMP/kommentar.md"
            gh issue comment "$nummer" --body-file "$RUNNER_TEMP/kommentar.md"
            echo "Issue #$nummer kommentiert."
            exit 0
          fi

          # Der Fließtext steht in einem Heredoc mit gequotetem Trenner, damit
          # Backticks und Dollarzeichen darin unangetastet bleiben; die Laufzeit-
          # Angaben kommen davor per echo dazu.
          {
            echo "Der nächtliche Vertragstest gegen die smartENERGY-API ist fehlgeschlagen."
            echo
            echo "**Fehlgeschlagener Lauf:** $LAUF_URL"
            if [ -n "$ANTWORTEN_URL" ]; then
              echo
              echo "**Rohantworten der API:** $ANTWORTEN_URL"
            fi
            echo
            cat <<'MARKDOWN'
          Mögliche Ursachen, absteigend nach Wahrscheinlichkeit:

          - Die API war vorübergehend nicht erreichbar. Dann ist der nächste Lauf wieder
            grün und dieses Issue kann geschlossen werden.
          - smartENERGY hat das Antwortformat geändert: `api.py` anpassen und die Fixtures
            in `tests/fixtures/` aktualisieren. Das Artefakt `live-antworten` am Lauf
            enthält die abgerufenen Antworten, formatiert wie die Fixtures – ein `diff`
            zeigt daher nur echte Unterschiede. Davon die **Feldänderung** übernehmen und
            die Fixture nicht überschreiben: Die handgerechneten Sollwerte der übrigen
            Tests hängen an ihren eingefrorenen Tagen und Preisen.
          - Die API liefert kein Viertelstundenraster mehr oder keine Daten für den
            aktuellen Zeitpunkt. Das betrifft die Preis-Mathematik im Koordinator.

          Lokal nachstellen:

          ```bash
          pytest -m live --live
          ```

          Weitere Fehlschläge werden als Kommentar an dieses Issue gehängt, solange es
          offen ist.
          MARKDOWN
          } > "$RUNNER_TEMP/issue-body.md"

          gh issue create \
            --label "$FEHLER_LABEL" \
            --title "Live-API-Test fehlgeschlagen" \
            --body-file "$RUNNER_TEMP/issue-body.md"
          echo "Neues Fehler-Issue angelegt."
