name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Bewusst NICHT auf einen Commit-SHA gepinnt: Das Repository wird nicht
      # getaggt (einziger Tag: 1.0.0), gepflegt wird allein "master". Ein Pin
      # würde den Validator einfrieren – und genau der soll die jeweils
      # aktuellen Hassfest-Regeln prüfen. Dependabot könnte ihn mangels
      # Releases auch nicht nachziehen.
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Ebenfalls bewusst ungepinnt, aus demselben Grund: Der letzte Tag von
      # hacs/action ist Jahre alt, gepflegt wird nur "main". Ein Pin auf den
      # alten Tag wäre ein Rückschritt beim Validator.
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # Nur Ruff installieren, nicht die ganze Testumgebung – der Linter braucht
      # kein Home Assistant. Die Version kommt trotzdem aus
      # requirements_test.txt, damit es genau einen Pin gibt, den Dependabot
      # pflegt. Fehlt die Zeile dort, bekommt pip kein Argument und der Schritt
      # schlägt fehl, statt still eine beliebige Version zu ziehen.
      - name: Install Ruff
        run: grep '^ruff==' requirements_test.txt | xargs pip install

      # --output-format=github hängt die Befunde als Annotationen direkt an die
      # betroffenen Zeilen im PR.
      - name: Ruff
        run: ruff check --output-format=github .

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Run pytest
        run: pytest
