[pytest]
# Repo-Wurzel auf den Importpfad, damit "custom_components.smartenergy" importierbar ist.
pythonpath = .
asyncio_mode = auto
testpaths = tests
markers =
    live: Ruft die echte smartENERGY-API ab; läuft nur mit der Option --live.

# --strict-markers: Ein vertippter Marker (z. B. "freeze_tim" statt
# "freeze_time") ist sonst nur eine Warnung – der Test läuft dann still ohne
# eingefrorene Uhr weiter. Diese Suite hängt an vielen Stellen an einer
# eingefrorenen Uhr, und ein solcher Tippfehler fällt allenfalls zufällig auf,
# weil die Fixture-Daten gerade in der Vergangenheit liegen.
addopts = --strict-markers

# Warnungen als Fehler. Die Suite ist heute warnungsfrei, das kostet also
# nichts – fängt aber Deprecations aus Home Assistant ab, bevor sie bei den
# Nutzern im Log landen (siehe CLAUDE.md zu via_device/via_device_id: eine
# Log-Warnung bei jedem Nutzer, die die Integration namentlich nennt).
#
# Zieht ein Dependabot-Update eine Warnung aus einer fremden Bibliothek nach,
# die uns nicht betrifft, gehört sie hier gezielt ausgenommen
# ("ignore:<Text>:<Kategorie>:<Modul>") – nicht die ganze Zeile gestrichen.
filterwarnings =
    error
